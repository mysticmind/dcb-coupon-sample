services:
  postgres:
    image: postgres:16
    container_name: dcb-postgres
    environment:
      POSTGRES_USER: dcb
      POSTGRES_PASSWORD: dcb
      POSTGRES_DB: dcb_sample
    ports:
      - "5432:5432"
    volumes:
      - dcb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcb -d dcb_sample"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  dcb_pgdata:
